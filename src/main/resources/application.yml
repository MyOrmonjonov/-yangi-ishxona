spring:
  application:
    name: task-app
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:task_app}}
    username: ${DATABASE_USERNAME:${PGUSER:postgres}}
    password: ${DATABASE_PASSWORD:${PGPASSWORD:postgres}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  bot-username: ${TELEGRAM_BOT_USERNAME:TaskAppBot}
  mini-app-url: ${TELEGRAM_MINI_APP_URL:${RENDER_EXTERNAL_URL:http://localhost:5173}}
  init-data-max-age: ${TELEGRAM_INIT_DATA_MAX_AGE:PT24H}

app:
  auth-secret: ${APP_AUTH_SECRET:}
  access-token-ttl: ${APP_ACCESS_TOKEN_TTL:P7D}
  upload-directory: ${UPLOAD_DIRECTORY:./data/uploads}
  bootstrap-owner-telegram-id: ${BOOTSTRAP_OWNER_TELEGRAM_ID:${BOOTSTRAP_DIRECTOR_TELEGRAM_ID:0}}

logging:
  level:
    uz.taskapp: INFO
