spring.application.name=yangi_ishxona

telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
# polling (default, for local dev) or webhook (for free hosts like Render that sleep idle
# services - a long-poll connection would just die silently, a webhook POST wakes it back up).
telegram.bot.mode=${TELEGRAM_BOT_MODE:polling}
telegram.bot.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
telegram.bot.public-url=${PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:}}
app.bootstrap.director-telegram-id=${BOOTSTRAP_DIRECTOR_TELEGRAM_ID:}
app.scheduler.deadline-check-interval-ms=${DEADLINE_CHECK_INTERVAL_MS:600000}
app.miniapp.base-url=${MINIAPP_BASE_URL:${PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}/miniapp}

spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.jackson.deserialization.fail-on-unknown-properties=false

# Individual PG* vars (not DATABASE_URL) so this works unchanged both with the local
# docker-compose Postgres and with Railway's Postgres plugin, which injects PGHOST/
# PGPORT/PGDATABASE/PGUSER/PGPASSWORD - avoids the postgres:// vs jdbc:postgresql:// mismatch.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:yangi_ishxona}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${PORT:8080}
server.servlet.session.timeout=30d
