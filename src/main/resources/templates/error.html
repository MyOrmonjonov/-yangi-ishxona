<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(#{web.error.title})}"></head>
<body>
<main class="container">
    <div class="card" style="text-align:center;">
        <h1 th:text="#{web.error.title}">⚠️ Ошибка</h1>
        <p th:text="${message}">Произошла ошибка.</p>
        <a class="btn btn-primary" th:href="@{/projects}" th:text="#{web.error.backToProjects}">К списку проектов</a>
    </div>
</main>
</body>
</html>
