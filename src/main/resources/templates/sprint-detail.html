<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${sprint.name})}"></head>
<body>
<div th:replace="~{fragments/layout :: nav(${user})}"></div>
<main class="container">
    <div class="breadcrumbs">
        <a th:href="@{/projects}" th:text="#{web.projects.title}">Проекты</a> /
        <a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.name}"></a> /
        <span th:text="${sprint.name}"></span>
    </div>
    <h1 th:text="${sprint.name}">Спринт</h1>
    <p class="subtitle">
        <span th:text="#{web.sprint.responsible}">Ответственный</span>: <b th:text="${sprint.responsible.fullName}"></b> ·
        <span th:text="#{web.sprint.deadline}">Дедлайн спринта</span>: <b th:text="${#temporals.format(sprint.deadline, 'dd.MM.yyyy')}"></b> ·
        <span th:text="#{web.col.status}">Статус</span>: <span class="badge" th:text="${sprintStatusLabel}"></span>
    </p>

    <h2 th:text="#{web.sprint.tasksTitle}">Задачи</h2>
    <form class="filters" method="get" th:action="@{/projects/{pid}/sprints/{sid}(pid=${project.id},sid=${sprint.id})}">
        <label th:text="#{web.filter.executor} + ':'">Исполнитель:
            <select name="executorId" onchange="this.form.submit()">
                <option value="" th:text="#{web.filter.all}">— все —</option>
                <option th:each="u : ${allUsers}" th:value="${u.id}" th:text="${u.fullName}"
                        th:selected="${selectedExecutorId != null and selectedExecutorId == u.id}"></option>
            </select>
        </label>
        <label th:text="#{web.filter.status} + ':'">Статус:
            <select name="status" onchange="this.form.submit()">
                <option value="" th:text="#{web.filter.all}">— все —</option>
                <option th:each="st : ${allStatuses}" th:value="${st}"
                        th:text="${@messages.t(user.language, 'common.taskStatus.' + st)}"
                        th:selected="${selectedStatus != null and selectedStatus == st.name()}"></option>
            </select>
        </label>
        <label>
            <input type="checkbox" name="overdueOnly" value="true" onchange="this.form.submit()" th:checked="${overdueOnly}"/>
            <span th:text="#{web.filter.overdueOnly}">только просроченные</span>
        </label>
    </form>

    <div th:if="${#lists.isEmpty(tasks)}" class="empty" th:text="#{web.sprint.tasksEmpty}">Задач с такими фильтрами не найдено.</div>
    <table th:unless="${#lists.isEmpty(tasks)}">
        <thead>
        <tr>
            <th th:text="#{web.col.task}">Задача</th>
            <th th:text="#{web.col.executor}">Исполнитель</th>
            <th th:text="#{web.col.status}">Статус</th>
            <th th:text="#{web.col.deadline}">Дедлайн</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tasks}">
            <td><a th:href="@{/tasks/{id}(id=${t.id})}" th:text="${t.name}"></a></td>
            <td th:text="${t.executorName}"></td>
            <td><span class="badge" th:text="${t.statusLabel}"></span></td>
            <td><span class="dot" th:classappend="${t.colorClass}"></span><span th:text="${t.deadlineLabel}"></span></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
