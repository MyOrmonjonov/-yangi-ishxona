<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${project.name})}"></head>
<body>
<div th:replace="~{fragments/layout :: nav(${user})}"></div>
<main class="container">
    <div class="breadcrumbs"><a th:href="@{/projects}" th:text="#{web.projects.title}">Проекты</a> / <span th:text="${project.name}"></span></div>
    <h1 th:text="${project.name}">Проект</h1>
    <p class="subtitle" th:text="${project.description}"></p>
    <p class="subtitle">
        <span th:text="#{web.project.responsible}">Ответственный</span>: <b th:text="${project.responsible.fullName}"></b> ·
        <span th:text="#{web.project.deadline}">Дедлайн проекта</span>: <b th:text="${#temporals.format(project.deadline, 'dd.MM.yyyy')}"></b> ·
        <span th:text="#{web.project.status}">Статус</span>: <span class="badge" th:text="${projectStatusLabel}"></span>
    </p>

    <h2 th:text="#{web.project.sprintsTitle}">Спринты</h2>
    <div th:if="${#lists.isEmpty(sprints)}" class="empty" th:text="#{web.project.sprintsEmpty}">В этом проекте пока нет спринтов.</div>
    <table th:unless="${#lists.isEmpty(sprints)}">
        <thead>
        <tr>
            <th th:text="#{web.project.sprintsTitle}">Спринт</th>
            <th th:text="#{web.project.responsible}">Ответственный</th>
            <th th:text="#{web.col.status}">Статус</th>
            <th th:text="#{web.projects.col.percent}">% выполнения</th>
            <th th:text="#{web.col.deadline}">Дедлайн</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${sprints}">
            <td><a th:href="@{/projects/{pid}/sprints/{sid}(pid=${project.id},sid=${s.id})}" th:text="${s.name}"></a></td>
            <td th:text="${s.responsibleName}"></td>
            <td><span class="badge" th:text="${s.statusLabel}"></span></td>
            <td>
                <span class="progress"><div th:style="'width:' + ${s.percentDone} + '%'"></div></span>
                <span th:text="${s.percentDone} + '%'"></span>
            </td>
            <td><span class="dot" th:classappend="${s.colorClass}"></span><span th:text="${s.deadlineLabel}"></span></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
