<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(#{web.projects.title})}"></head>
<body>
<div th:replace="~{fragments/layout :: nav(${user})}"></div>
<main class="container">
    <h1 th:text="#{web.projects.title}">Проекты</h1>
    <p class="subtitle" th:text="#{web.projects.subtitle}">Список проектов.</p>

    <div th:if="${#lists.isEmpty(projects)}" class="empty" th:text="#{web.projects.empty}">Пока нет ни одного проекта.</div>

    <table th:unless="${#lists.isEmpty(projects)}">
        <thead>
        <tr>
            <th th:text="#{web.projects.col.project}">Проект</th>
            <th th:text="#{web.projects.col.responsible}">Ответственный</th>
            <th th:text="#{web.projects.col.status}">Статус</th>
            <th th:text="#{web.projects.col.percent}">% выполнения</th>
            <th th:text="#{web.projects.col.deadline}">Ближайший дедлайн</th>
            <th th:text="#{web.projects.col.overdue}">Просрочено задач</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${projects}">
            <td><a th:href="@{/projects/{id}(id=${p.id})}" th:text="${p.name}">Проект</a></td>
            <td th:text="${p.responsibleName}">Ответственный</td>
            <td><span class="badge" th:text="${p.statusLabel}">Статус</span></td>
            <td>
                <span class="progress"><div th:style="'width:' + ${p.percentDone} + '%'"></div></span>
                <span th:text="${p.percentDone} + '%'"></span>
            </td>
            <td><span class="dot" th:classappend="${p.colorClass}"></span><span th:text="${p.deadlineLabel}"></span></td>
            <td th:text="${p.overdueCount}">0</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
