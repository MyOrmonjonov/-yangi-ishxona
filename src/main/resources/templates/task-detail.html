<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${task.name})}"></head>
<body>
<div th:replace="~{fragments/layout :: nav(${user})}"></div>
<main class="container">
    <div class="breadcrumbs">
        <a th:href="@{/projects}" th:text="#{web.projects.title}">Проекты</a> /
        <a th:href="@{/projects/{id}(id=${task.sprint.project.id})}" th:text="${task.sprint.project.name}"></a> /
        <a th:href="@{/projects/{pid}/sprints/{sid}(pid=${task.sprint.project.id},sid=${task.sprint.id})}" th:text="${task.sprint.name}"></a> /
        <span th:text="${task.name}"></span>
    </div>

    <div class="card">
        <h1 th:text="${task.name}">Задача</h1>
        <p class="subtitle" th:text="${task.description}"></p>
        <p>
            <span th:text="#{web.col.executor}">Исполнитель</span>: <b th:text="${task.executor.fullName}"></b> ·
            <span th:text="#{web.col.status}">Статус</span>: <span class="badge" th:text="${statusLabel}"></span> ·
            <span th:text="#{web.col.deadline}">Дедлайн</span>: <b th:text="${deadlineLabel}"></b>
        </p>
    </div>

    <h2 th:text="#{web.task.attachmentsTitle}">Вложения</h2>
    <div th:if="${#lists.isEmpty(attachments)}" class="empty" th:text="#{web.task.attachmentsEmpty}">Файлов пока нет.</div>
    <ul th:unless="${#lists.isEmpty(attachments)}">
        <li th:each="a : ${attachments}">
            <a th:href="@{/attachments/{id}/open(id=${a.id})}" target="_blank" th:text="${a.originalFileName}">файл</a>
            <span class="subtitle" th:text="'· ' + #{web.task.uploadedBy} + ' ' + ${a.uploadedBy.fullName}"></span>
        </li>
    </ul>

    <h2 th:text="#{web.task.historyTitle}">История статусов</h2>
    <div th:if="${#lists.isEmpty(history)}" class="empty" th:text="#{web.task.historyEmpty}">Изменений пока не было.</div>
    <div th:unless="${#lists.isEmpty(history)}" class="card">
        <div class="comment" th:each="h : ${history}">
            <div th:text="${h.transition}"></div>
            <div class="meta" th:text="${h.changedByName} + ' · ' + ${h.changedAtLabel}"></div>
            <div th:if="${h.comment}" th:text="${h.comment}"></div>
        </div>
    </div>

    <h2 th:text="#{web.task.commentsTitle}">Комментарии</h2>
    <div th:if="${#lists.isEmpty(comments)}" class="empty" th:text="#{web.task.commentsEmpty}">Комментариев пока нет.</div>
    <div th:unless="${#lists.isEmpty(comments)}" class="card">
        <div class="comment" th:each="c : ${comments}">
            <div th:text="${c.text}"></div>
            <div class="meta" th:text="${c.authorName} + ' · ' + ${c.createdAtLabel}"></div>
        </div>
    </div>
</main>
</body>
</html>
